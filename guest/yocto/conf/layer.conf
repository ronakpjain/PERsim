# Optional development-only SocketCAN/TCP client for Yoctocoupler.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILE_COLLECTIONS += "persim"
BBFILE_PATTERN_persim := "^${LAYERDIR}/"
BBFILE_PRIORITY_persim = "10"
LAYERDEPENDS_persim = "core"
LAYERSERIES_COMPAT_persim = "scarthgap"
